<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Astro Turfer</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070f;
      }

      body {
        font-family: monospace;
        background:
          radial-gradient(circle at top, rgba(43, 70, 122, 0.28), transparent 38%),
          linear-gradient(180deg, #081022 0%, #05070f 100%);
      }

      #app-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      #game-shell {
        position: relative;
        width: min(100vw, calc(100dvh * 16 / 9));
        height: min(100dvh, calc(100vw * 9 / 16));
        max-width: 100vw;
        max-height: 100dvh;
      }

      #game-frame,
      #game {
        position: absolute;
        inset: 0;
      }

      #game {
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #touch-overlay {
        position: absolute;
        inset: 0;
        display: none;
        pointer-events: none;
        z-index: 20;
      }

      #app-shell.touch-controls-active #touch-overlay {
        display: block;
      }

      #touch-move-group {
        position: absolute;
        left: max(6px, calc(env(safe-area-inset-left) + 4px));
        bottom: max(8px, calc(env(safe-area-inset-bottom) + 6px));
        display: flex;
        gap: 10px;
        pointer-events: none;
      }

      .touch-button {
        position: absolute;
        pointer-events: auto;
        appearance: none;
        border: 0;
        border-radius: 999px;
        background:
          radial-gradient(circle at 30% 28%, rgba(90, 134, 196, 0.12), rgba(21, 38, 69, 0.28) 62%),
          rgba(16, 32, 61, 0.12);
        box-shadow:
          inset 0 0 0 1px rgba(224, 244, 255, 0.06),
          0 8px 16px rgba(0, 0, 0, 0.14);
        color: rgba(243, 251, 255, 0.58);
        font-family: monospace;
        font-weight: 700;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition:
          transform 90ms ease,
          opacity 120ms ease,
          box-shadow 120ms ease,
          background 120ms ease;
      }

      .touch-button[data-active='true'] {
        transform: scale(0.96);
        background:
          radial-gradient(circle at 30% 28%, rgba(120, 178, 242, 0.3), rgba(34, 58, 101, 0.5) 62%),
          rgba(22, 49, 93, 0.28);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.12),
          0 8px 18px rgba(0, 0, 0, 0.18);
        color: rgba(243, 251, 255, 0.92);
      }

      #touch-left,
      #touch-right,
      #touch-jump {
        width: clamp(72px, 18vw, 110px);
        height: clamp(72px, 18vw, 110px);
      }

      #touch-pause {
        width: clamp(66px, 15vw, 96px);
        height: clamp(66px, 15vw, 96px);
      }

      #touch-left,
      #touch-right {
        position: static;
        font-size: clamp(34px, 8vw, 46px);
      }

      #touch-jump {
        right: max(6px, calc(env(safe-area-inset-right) + 4px));
        bottom: max(8px, calc(env(safe-area-inset-bottom) + 6px));
        font-size: clamp(18px, 4.4vw, 26px);
        letter-spacing: 0.08em;
      }

      #touch-pause {
        right: max(6px, calc(env(safe-area-inset-right) + 4px));
        top: max(8px, calc(env(safe-area-inset-top) + 4px));
        font-size: clamp(13px, 3.3vw, 18px);
        letter-spacing: 0.08em;
      }

      @media (pointer: coarse) and (max-width: 900px) and (orientation: portrait) {
        #touch-left,
        #touch-right,
        #touch-jump {
          width: clamp(64px, 20vw, 92px);
          height: clamp(64px, 20vw, 92px);
        }

        #touch-pause {
          width: clamp(58px, 16vw, 82px);
          height: clamp(58px, 16vw, 82px);
        }

        #touch-move-group {
          left: max(4px, calc(env(safe-area-inset-left) + 2px));
          bottom: max(6px, calc(env(safe-area-inset-bottom) + 4px));
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="game-shell">
        <main id="game-frame">
          <div id="game"></div>
        </main>
      </div>
      <div id="touch-overlay">
        <div id="touch-move-group">
          <button id="touch-left" class="touch-button" type="button" aria-label="Move left">&larr;</button>
          <button id="touch-right" class="touch-button" type="button" aria-label="Move right">&rarr;</button>
        </div>
        <button id="touch-pause" class="touch-button" type="button" aria-label="Pause game">PAUSE</button>
        <button id="touch-jump" class="touch-button" type="button" aria-label="Jump">JUMP</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
